[build]
  command = "echo 'static site — no build step'"
  publish = "."

[functions]
  directory = "netlify/functions"

[context.production]
  environment = { NODE_VERSION = "20" }

# Rewrite /api/* to /.netlify/functions/* so index.html's /api/ calls
# work on Netlify (Vercel uses api/ natively; this shim bridges the gap
# until DNS is flipped to Vercel).
[[redirects]]
  from = "/api/:name"
  to = "/.netlify/functions/:name"
  status = 200

# SPA-style: keep unknown paths on the same HTML file
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
